  const partner=normalize(project.partner);
  const year=String(project.year??'').trim();

    item.aliases.some(alias=>normalize(alias)===title) &&

    (!item.year || item.year===year)
  ) || null;
};

&lt;style id=&quot;groo-header-dropdown-unified-v22&quot;&gt;
/* =========================================================
   HEADER / RIBBON MENU — FINAL UNIFIED BEHAVIOR
   HOME + ABOUT + BUSINESS + PROJECTS + NEWS + RECRUIT + CONTACT
   ========================================================= */

#header,
#header .header-in,
#header .head,
#header nav,
#header .nav,
#header .main-nav,
#header .nav-item{
  overflow:visible!important;
}

#header .nav-item{
  position:relative!important;
}

/* 상단 메뉴 기본 글자 */
#header .nav-item&gt;a{
  position:relative!important;
  opacity:.82!important;
  transition:opacity .20s ease!important;
}

/* hover 시 글자 선명 */
#header .nav-item:hover&gt;a{
  opacity:1!important;
}

/* 상단 얇은 밑줄 — 모든 메뉴 동일 */
#header .nav-item&gt;a::after{
  content:&quot;&quot;!important;
  position:absolute!important;
  left:0!important;
  bottom:-9px!important;
  width:0!important;
  height:1px!important;
  background:currentColor!important;
  transition:width .22s ease!important;
}
#header .nav-item:hover&gt;a::after,
#header .nav-item&gt;a:focus-visible::after{
  width:100%!important;
}

/* 메뉴와 드롭다운 사이 마우스 이동용 브리지 */
#header .nav-item:has(&gt;.dropdown)::before{
  content:&quot;&quot;!important;
  position:absolute!important;
  left:-16px!important;
  right:-16px!important;
  top:50px!important;
  height:28px!important;
  z-index:998!important;
}

/* desktop dropdown */
@media(min-width:721px){
  #header .nav-item&gt;.dropdown{
    display:block!important;
    position:absolute!important;
    top:64px!important;
    left:50%!important;
    z-index:999!important;
    width:220px!important;
    min-width:220px!important;
    padding:12px!important;
    margin:0!important;

    border:1px solid #ddd9d3!important;
    border-radius:4px!important;
    background:rgba(255,255,255,.985)!important;
    box-shadow:0 16px 38px rgba(0,0,0,.11)!important;

    opacity:0!important;
    visibility:hidden!important;
    pointer-events:none!important;
    transform:translate(-50%,6px)!important;
    transition:opacity .18s ease, transform .18s ease, visibility .18s ease!important;
  }

  /* 실제 hover일 때만 열림 */
  #header .nav-item:hover&gt;.dropdown,
  #header .nav-item&gt;a:focus-visible + .dropdown{
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
    transform:translate(-50%,0)!important;
  }
}

/* dropdown item */
#header .dropdown a{
  display:block!important;
  padding:12px 14px!important;
  margin:0!important;
  border:0!important;
  box-shadow:none!important;
  text-decoration:none!important;

  background:transparent!important;
  color:#56514c!important;
  font-family:&quot;Noto Sans KR&quot;,sans-serif!important;
  font-size:12px!important;
  font-weight:400!important;
  line-height:1.45!important;
  letter-spacing:0!important;

  transition:background .16s ease,color .16s ease!important;
}

#header .dropdown a::before,
#header .dropdown a::after{
  display:none!important;
  content:none!important;
}

#header .dropdown a:hover,
#header .dropdown a:focus{
  padding-left:14px!important;
  background:#f1efea!important;
  color:var(--orange,#ed5b2a)!important;
}

/* 현재 페이지라고 드롭다운 항목을 강제로 칠하지 않음 */
#header .dropdown a.active,
#header .dropdown [aria-current=&quot;page&quot;]{
  background:transparent!important;
  color:#56514c!important;
}

/* mobile */
@media(max-width:720px){
  #header .nav-item::before{
    display:none!important;
  }

  #header .nav-item&gt;.dropdown{
    position:static!important;
    display:none!important;
    width:auto!important;
    min-width:0!important;
    padding:2px 0 8px!important;
    border:0!important;
    border-bottom:1px solid var(--line)!important;
    border-radius:0!important;
    background:transparent!important;
    box-shadow:none!important;
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
    transform:none!important;
    transition:none!important;
  }

  #header .nav-item.open&gt;.dropdown{
    display:block!important;
  }
}

const heroProjectNumbers=[&#x27;018&#x27;,&#x27;022&#x27;,&#x27;024&#x27;,&#x27;020&#x27;];
const heroProjects=heroProjectNumbers.map(no=&gt;{

});

}

const heroCurrent=document.getElementById(&#x27;heroCurrent&#x27;);
const heroPrev=document.getElementById(&#x27;heroPrev&#x27;);
const heroNext=document.getElementById(&#x27;heroNext&#x27;);

function updateHeroPanel(){
  const p=heroProjects[index];
  if(!heroProjectInfo||!p) return;
  heroProjectInfo.classList.add(&#x27;is-changing&#x27;);
  setTimeout(()=&gt;{
    heroProjectType.textContent=p.type;
    heroProjectInfo.querySelector(&#x27;.hp-title&#x27;).textContent=p.title;
    heroProjectInfo.querySelector(&#x27;.hp-title&#x27;).setAttribute(&#x27;href&#x27;,&#x27;#project-&#x27;+p.no);
    heroProjectInfo.querySelector(&#x27;.hp-meta&#x27;).textContent=p.meta;
    heroProjectInfo.querySelector(&#x27;.hp-partner&#x27;).textContent=p.partner;
    heroCurrent.textContent=String(index+1).padStart(2,&#x27;0&#x27;);
    heroPanelDots.forEach((d,i)=&gt;d.classList.toggle(&#x27;active&#x27;,i===index));
    heroProjectInfo.classList.remove(&#x27;is-changing&#x27;);
  },120);
}
function show(n){
  if(!slides.length) return;
  index=(n+slides.length)%slides.length;
  slides.forEach((s,i)=&gt;s.classList.toggle(&#x27;active&#x27;,i===index));
  updateHeroPanel();
}
function auto(){
  clearInterval(timer);
  timer=setInterval(()=&gt;show(index+1),5000);
}
heroPanelDots.forEach(d=&gt;d.addEventListener(&#x27;click&#x27;,e=&gt;{
  e.preventDefault();
  show(Number(d.dataset.heroIndex));
  auto();
}));
heroPrev?.addEventListener(&#x27;click&#x27;,()=&gt;{show(index-1);auto()});
heroNext?.addEventListener(&#x27;click&#x27;,()=&gt;{show(index+1);auto()});
show(0);auto();

  },
  bim:{

    list:[&#x27;건축·구조·설비 모델 통합 및 간섭 검토&#x27;,&#x27;설계 변경 사항의 빠른 검토와 협업 데이터 정리&#x27;,&#x27;실시설계 단계의 정합성 향상과 오류 사전 확인&#x27;]
  },

top:70px!important}\n\n/* Smooth-scroll grouped sections */\nhtml{scroll-behavior:smooth}\n.section-scroll-tabs{\n  position:sticky;top:70px;z-index:35;background:rgba(251,250,247,.94);\n  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)\n}\n.section-scroll-tabs .container{display:flex;gap:30px;align-items:center;min-height:52px;overflow-x:auto}\n.section-scroll-tabs a{font-size:12px;font-weight:500;color:#777;white-space:nowrap;transition:.2s}\n.section-scroll-tabs a:hover{color:var(--orange)}\nbody.group-about #history .page-hero,\nbody.group-about #organization .page-hero,\nbody.group-about #certificates .page-hero,\nbody.group-business #collaboration .page-hero,\nbody.group-projects #business-bim .page-hero,\nbody.group-projects #business-design .page-hero,\nbody.group-projects #business-supervision .page-hero{\n  display:none!important;\n}\n\nbody.group-about #company,\nbody.group-about #history,\nbody.group-about #organization,\nbody.group-about #certificates,\nbody.group-business #business-services,\nbody.group-business #collaboration,\nbody.group-projects #projects-execution,\nbody.group-projects #business-bim,\nbody.group-projects #business-design,\nbody.group-projects #business-supervision{\n  display:block!important;\n}\n\nbody.group-about .section-page-nav,\nbody.group-business .section-page-nav,\nbody.group-projects .section-page-nav{\n  display:none!important;\n}\nbody.group-about #history,body.group-about #organization,body.group-about #certificates,\nbody.group-business #collaboration,\nbody.group-projects #business-bim,body.group-projects #business-design,body.group-projects #business-supervision{\n  border-top:1px solid var(--line)\n}\n\n/* Greeting — concise, editorial and shorter */\n#company>.section{padding:82px 0 92px!important}\n#company .profile{display:grid!important;grid-template-columns:240px 1fr!important;gap:54px!important;align-items:start!important;margin:0!important;padding:42px 0!important;border-top:1px solid var(--li ont-size:clamp(32px,3.7vw,57px)!important}\n\n/* Contact — rebuilt to match the editorial system */\n.contact-editorial-hero{padding-bottom:64px!important}\n.contact-editorial-main{padding:86px 0 92px;background:#fbfaf7}\n.contact-editorial-grid{display:grid;grid-template-columns:.88fr 1.12fr;gap:72px;align-items:stretch}\n.contact-editorial-copy{padding:12px 0}\n.contact-editorial-copy h2{font-size:clamp(36px,4.2vw,58px);font-weight:400;line-height:1.12;letter-spacing:-.06em;margin:22px 0}\n.contact-editorial-copy h2 em{font-style:normal;color:var(--orange)}\n.contact-editorial-copy>p{font-size:14px;line-height:1.9;color:#777;max-width:580px}\n.contact-editorial-details{margin-top:48px;border-top:1px solid var(--line)}\n.contact-editorial-details>div{display:grid;grid-template-columns:92px 1fr;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}\n.contact-editorial-details small{font:600 8px \"Space Grotesk\",sans-serif;letter-spacing:.14em;color:var(--orange)}\n.contact-editorial-details strong,.contact-editorial-details a{font-size:12.5px;font-weight:400;line-height:1.7;color:#333}\n.contact-editorial-map{min-height:520px;position:relative;background:#ddd;overflow:hidden}\n.contact-editorial-map iframe{width:100%;height:100%;min-height:520px;border:0;filter:grayscale(.18) contrast(.96)}\n.contact-map-links{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:rgba(20,20,20,.88)}\n.contact-map-links a{padding:18px 22px;color:#fff;font:500 9px \"Space Grotesk\",sans-serif;letter-spacing:.12em;border-right:1px solid rgba(255,255,255,.18)}\n.contact-map-links a:last-child{border-right:0}\n.contact-editorial-inquiry{background:#171717;color:#fff;padding:84px 0 88px}\n.contact-inquiry-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:90px}\n.contact-inquiry-heading h2{font-size:clamp(34px,3.8vw,54px);font-weight:400;line-height:1.14;letter-spacing:-.055em;margin:18px 0}\n.contact-inquiry-heading p{font-size:13px;color:#999}\n.contact-editorial-form{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}\n.contact-editorial-form label{display:block;border-bottom:1px solid #4a4a4a;padding-bottom:9px}\n.contact-editorial-form label.wide{grid-column:1/-1}\n.contact-editorial-form span{display:block;font:600 8px \"Space Grotesk\",sans-serif;letter-spacing:.14em;color:#f39a6b;margin-bottom:8px}\n.contact-editorial-form input,.contact-editorial-form select,.contact-editorial-form textarea{width:100%;border:0;background:transparent;color:#fff;font-size:13px;outline:0;padding:5px 0}\n.contact-editorial-form select option{color:#111}\n.contact-editorial-form textarea{height:86px;resize:vertical}\n.contact-editorial-form button{grid-column:1/-1;margin-top:8px;height:52px;border:1px solid #666;background:transparent;color:#fff;text-align:left;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font:600 10px \"Space Grotesk\",sans-serif;letter-spacing:.12em;cursor:pointer;transition:.25s}\n.contact-editorial-form button:hover{background:#fff;color:#171717;border-color:#fff}\n\n/* Main page title typography follows the same restrained Korean family */\n.page h1,.page h2,.page h3{font-family:\"Noto Sans KR\",sans-serif}\n.page-hero h1{font-weight:300}\n.page-hero h1 em{font-weight:400}\n\n@media(max-width:900px){\n  #header{height:64px!important}.header-in{height:64px!important}.nav-item{height:auto!important}\n  .page{padding-top:64px!important}.section-scroll-tabs{top:64px}\n  #company .profile,#company .profile>div:last-child{grid-template-columns:1fr!important;gap:18px!important}\n  #company .profile .copy{grid-column:1!important;grid-row:auto!important}\n  .contact-editorial-grid,.contact-inquiry-grid{grid-template-columns:1fr;gap:44px}\n  .contact-editorial-map,.contact-editorial-map iframe{min-height:380px}\n}\n@media(max-width:620px){\n  .section-scroll-tabs .container{gap:20px;min-height:48px}\n  .org-hierarchy .org-team-final{grid-template-columns:1fr!important}\n  .org-hierarchy .org-team-final:before{display:none}\n  .contact-editorial-form{grid-template-columns:1fr}\n  .contact-editorial-form label.wide,.contact-editorial-form button{grid-column:1}\n}\n</style>\n\n\n<style id=\"round3-app-fix\">\n#company .profile>div:last-child{grid-column:1/-1!important;width:100%!important}\n\n/* Grouped pages follow the requested vertical order regardless of legacy DOM order */\nbody.group-about #main,\nbody.group-business #main,\nbody.group-projects #main{display:flex;flex-direction:column}\nbody.group-about #company{order:1}\nbody.group-about #history{order:2}\nbody.group-about #organization{order:3}\nbody.group-about #certificates{order:4}\nbody.group-business #business-services{order:1}\nbody.group-business #collaboration{order:2}\nbody.group-projects #projects-execution{order:1}\nbody.group-projects #business-bim{order:2}\nbody.group-projects #business-design{order:3}\nbody.group-projects #business-supervision{order:4}\n\nbody.group-about .detail-page,body.group-business .detail-page,body.group-projects .detail-page{order:99}\n</style>\n\n<style id=\"round3-sequence-cleanup\">.about-sequence{display:none!important}</style>\n\n<style id=\"round4-project-news-nav\">\n/* Project detail card: larger than before, still clearly smaller than the viewport */\n.groo-card-dialog{width:min(1380px,92vw)!important;max-height:90vh!important}\n.groo-project-modal-grid{grid-template-columns:minmax(0,1.38fr) minmax(350px,.62fr)!important;min-height:min(720px,80vh)!important}\n.groo-project-modal-media{min-height:min(720px,80vh)!important}\n.groo-project-modal-copy{padding:70px 56px 48px!important}\n\n/* Monthly NEWS archive */\n.news-month-panel{min-width:0}\n.news-month-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 0 18px;border-bottom:1px solid var(--line)}\n.news-month-toolbar>div:first-child span{display:block;font:600 8px/1 \"Space Grotesk\",sans-serif;letter-spacing:.16em;color:var(--orange);margin-bottom:9px}\n.news-month-toolbar>div:first-child strong{font:500 22px/1 \"Space Grotesk\",\"Noto Sans KR\",sans-serif;letter-spacing:-.03em}\n.news-list-pager{display:flex;align-items:center;gap:10px}\n.news-list-pager button{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:#444;cursor:pointer;transition:.2s}\n.news-list-pager button:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}\n.news-list-pager button:disabled{opacity:.28;cursor:default}\n.news-list-pager span{min-width:54px;text-align:center;font:500 8px \"Space Grotesk\",sans-serif;letter-spacing:.08em;color:#888}\n.news-reference-list{border-top:0!important}\n.news-reference-item{animation:newsRowIn .35s ease both}\n@keyframes newsRowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.news-month-empty{padding:70px 0;border-bottom:1px solid var(--line);color:#999;font-size:12px}\n\n/* Calendar dates with events are real controls */\nbutton.calendar-day{padding:0;cursor:default;font-family:\"Space Grotesk\",sans-serif}\nbutton.calendar-day.has-event{cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s}\nbutton.calendar-day.has-event:hover{background:#171717;border-color:#171717;color:#fff;transform:translateY(-1px)}\nbutton.calendar-day.has-event:focus-visible{outline:2px solid var(--orange);outline-offset:2px}\n.calendar-schedule-list button{width:100%;display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:10.5px;cursor:pointer;color:inherit}\n.calendar-schedule-list button:hover span{color:var(--orange)}\n.calendar-schedule-list button time{color:var(--orange);font-weight:600}\n\n/* Keep the common top navigation above every grouped/scrolling section */\n#header{z-index:5000!important;pointer-events:auto!important}\n#header .header-in,#header .nav,#header .nav-item,#header .nav-item>a{po hitecture<br/><em>with Detail</em></h1><p>건축의 의도를 현실로 구현하는 설계 전문 조직</p></div></div>\n<nav class=\"section-scroll-tabs about-scroll-tabs\" aria-label=\"회사소개 섹션\">\n  <div class=\"container\">\n    <a href=\"#company\">대표인사</a><a href=\"#history\">회사개요</a><a href=\"#milestones\">주요 연혁</a><a href=\"#organization\">조직도</a><a href=\"#certificates\">인증</a>\n  </div>\n</nav>\n<section class=\"section greeting-section\"><div class=\"container\">\n<div class=\"greeting-heading\"><div class=\"eyebrow\">GREETING</div><h2>대표인사</h2></div>\n<div class=\"greeting-welcome\"><div class=\"eyebrow\">WELCOME TO GROO</div><h2>그루터기건축사사무소 홈페이지를<br/> 방문해주신 여러분을 진심으로 환영합니다</h2></div>\n<div class=\"greeting-letters\"><article class=\"greeting-paper\" aria-labelledby=\"greeting-name-01\">\n<div class=\"greeting-paper-role\"><div class=\"eyebrow\">01 / 대표 CEO</div><h3 id=\"greeting-name-01\">최은중</h3></div>\n<div class=\"greeting-paper-text\"><p>안녕하십니까, 그루터기건축사사무소 대표 최은중입니다</p><p>저희는 다양한 프로젝트와 대형 설계사무소와의 협업 경험을 바탕으로 신뢰받는 파트너가 되고자 합니다</p><p>프로젝트의 목적과 설계 의도를 정확히 이해하고, 발주처와 협력사의 요구에 유연하게 대응합니다</p><p>단순한 업무 수행을 넘어 필요한 부분을 먼저 살피고 함께 해결하는 협업을 중요하게 생각합니다</p><p>한 번의 인연이 지속적인 신뢰와 새로운 프로젝트로 이어질 수 있도록 책임 있게 함께하겠습니다</p><div class=\"greeting-signature\">대표 <strong>최은중</strong> 올림</div></div>\n</article><article class=\"greeting-paper\" aria-labelledby=\"greeting-name-02\">\n<div class=\"greeting-paper-role\"><div class=\"eyebrow\">02 / 대표 CEO</div><h3 id=\"greeting-name-02\">이현주</h3></div>\n<div class=\"greeting-paper-text\"><p>안녕하십니까, 그루터기건축사사무소 대표 이현주입니다</p><p>좋은 설계는 아이디어를 실제 시공 가능한 도면과 디테일로 정확하게 구현하는 과정에서 완성됩니다</p><p>저희는 공동주택과 복합건축물의 실시설계 경험을 바탕으로 도면의 정합성과 시공성을 세밀하게 검토합니다</p><p>BIM을 활용해 간섭과 오류를 사전에 확인하고 분야별 정보를 연결하여 설계의 정확도를 높이고 있습니다</p><p>축적된 실무 경험과 꼼꼼한 검토를 바탕으로 완성도 높은 설계 결과물을 만들어가겠습니다</p><div class=\"greeting-signature\">대표 <strong>이현주</strong> 올림</div></div>\n</article></div>\n</div></section></section><section class=\"page\" id=\"organization\"><div class=\"page-hero\"><div class=\"container\"><div class=\"eyebrow\">ABOUT</div><h1>People behind<br/><em>the detail</em></h1><p>전문성과 협업을 기반으로 프로젝트의 완성도를 높이는 조직</p></div></div><section class=\"section\"><div class=\"container\">\n  <div class=\"org-title\"><div class=\"eyebrow\">ORGANIZATION</div><h2>조직도</h2><p>실시설계와 BIM을 중심으로 역할과 책임이 명확하게 연결되는 조직</p></div>\n  <div class=\"org-v22 org-hierarchy\">\n  <div class=\"org-axis\">\n    <div class=\"org-leader-pair\">\n      <article class=\"org-rank org-rank-lead\"><small>CEO</small><strong>대표 · 최은중</strong></article>\n      <article class=\"org-rank org-rank-lead\"><small>CEO</small><strong>대표 · 이현주</strong></article>\n    </div>\n    <i aria-hidden=\"true\"></i>\n  </div>\n  <div class=\"org-team-grid org-team-final\">\n    <article><span>01</span><h3>실시설계 1팀</h3><p>공동주택과 대규모 프로젝트의 실시설계 및 상세 검토</p></article>\n    <article><span>02</span><h3>실시설계 2팀</h3><p>주상복합과 복합건축물의 실시설계 및 도서 정합성 검토</p></article>\n    <article><span>03</span><h3>BIM팀</h3><p>BIM 전환설계와 간섭 검토, 분야별 모델 협업</p></article>\n    <article><span>04</span><h3>감리팀</h3><p>현장 품질과 주요 디테일, 설계 의도 구현 검토</p></article>\n  </div>\n</div></div></section></section><section class=\"page\" id=\"history\"><div class=\"page-hero\"><div class=\"container\"><div class=\"eyebrow\">ABOUT</div><h1>Company<br/><em>Profile</em></h1><p>그루터기의 기업 정보와 주요 발자취</p></div></div><section class=\"section history-section\"><div class=\"container\"><div class=\"history-overview-block\"><div class=\"overview-head\"><div><div class=\"eyebrow\">COMPANY PROFILE</div><h2>회사 개요</h2></div></div><div class=\"company-overview-table\">\n<div class=\"overview-row\"><div class=\"overview-label\">상호(국문)</div><div class=\"overview-value\">주식회사 그루터기건축사사무소</div><div class=\"overview-label\">대표</div><div class=\"overview-value\">최은중, 이현주</div></div>\n<div class=\"overview-row\"><div class=\"overview-label\">설립일</div><div class=\"overview-value\">2015년 3월 16일</div><div class=\"overview-label\">대표전화</div><div class=\"overview-value\">02-516-9969</div></div>\n<div class=\"overview-row\"><div class=\"overview-label\">주소</div><div class=\"overview-value\">서울특별시 송파구 법원로11길 7,<br/>문정현대지식산업센터 C동 401호</div><div class=\"overview-label\">이메일</div><div class=\"overview-value\"><a href=\"mailto:groo@grooarchi.com\">groo@grooarchi.com</a></div></div>\n</div></div><div class=\"history-head history-head-second\"><div id=\"milestones\"><div class=\"eyebrow\">HISTORY</div><h2>주요 연혁</h2></div></div><div class=\"history-timeline\">\n\n<article class=\"history-item\"><div class=\"history-year\">2015.03</div><div class=\"history-dot\"></div><div class=\"history-content\"><h3>건축사사무소 개설</h3><p>건축사사무소 개설 신고 <span>(송파구-건축사사무소-810호)</span></p></div></article>\n<article class=\"history-item history-feature\"><div class=\"history-year\">2017–2026</div><div class=\"history-dot\"></div><div class=\"history-content\"><h3>실시설계 협업 확대</h3><p>정림건축·하람건축 등과 공동주택, 주상복합, 오피스텔, 일반건물 분야의 실시설계 프로젝트를 수행하며 전문성을 확장했습니다.</p><div class=\"history-stat\"><strong>28</strong><span>PROJECTS<br/>실시설계 수행</span></div></div></article>\n<article class=\"history-item\"><div class=\"history-year\">2021.06</div><div class=\"history-dot\"></div><div class=\"history-content\"><h3>법인 설립</h3><p>주식회사 그루터기건축사사무소 법인 설립 · 사업자등록 <span>(805-88-02100)</span></p></div></article>\n<article class=\"history-item history-feature\"><div class=\"history-year\">2024</div><div class=\"history-dot\"></div><div class=\"history-content\"><h3>대형 프로젝트 수행</h3><p>남해군 서대리 관광숙박시설 및 용인 클러스터 지원/상생시설 등 대형 프로젝트 진행</p><div class=\"history-project-meta\"><span>용인 클러스터 지원/상생시설</span><strong>517,732㎡</strong><small>오피스 · 정림건축 협업</small></div></div></article>\n</div></div></section></section><section class=\"page\" id=\"certificates\"><div class=\"page-hero\"><div class=\"container\"><div class=\"eyebrow\">ABOUT</div><h1>Company<br/><em>Documents</em></h1><p>그루터기의 주요 등록 및 자격 서류</p></div></div><section class=\"section\"><div class=\"container\"><div class=\"eyebrow\">CERTIFICATION</div><h2>인증</h2><p class=\"copy\">아래 서류를 클릭하면 v class=\"container\"></div></section></section><section class=\"page\" id=\"business-supervision\"><div class=\"page-hero\"><div class=\"container\"><div class=\"eyebrow\">PROJECTS</div><h1>Supervision<br/><em>Projects</em></h1><p>현장 중심의 감리 프로젝트</p></div></div><section class=\"section\"><div class=\"container\"><div id=\"supervisionProjectArchive\"></div></div><div class=\"container\"></div></section></section><section class=\"page\" id=\"business-services\"><section class=\"section business-service-section\"><div class=\"container\"><div class=\"business-service-intro\"><div><div class=\"eyebrow\">SERVICES &amp; BIM CAPABILITY</div><h2>전문 실시설계 및 BIM 고도화 시스템</h2></div><p>대형 설계사무소와의 협업 경험을 바탕으로 실시설계와 BIM을 중심으로, 계획설계·감리·현장 검토까지 프로젝트에 필요한 실무 서비스를 제공합니다</p></div><div class=\"service-editorial-list\">\n<article class=\"service-editorial-item\"><div class=\"service-no\">01</div><div class=\"service-main\"><small>EXECUTION DESIGN</small><h3>실시설계 전문성</h3></div><p>공동주택·주상복합·오피스텔·숙박시설·일반건물 등 다양한 용도의 실시설계를 수행하며 도면 완성도와 시공성을 함께 검토합니다.</p><div class=\"service-mark\">↗</div></article>\n<article class=\"service-editorial-item\"><div class=\"service-no\">02</div><div class=\"service-main\"><small>BIM &amp; STRUCTURE</small><h3>BIM 전환설계 · 구조 검토</h3></div><p>2D 설계 도서를 BIM 모델로 전환하고 간섭 검토와 물량·구조 정보의 정합성을 확인해 설계 리스크를 줄입니다.</p><div class=\"service-mark\">↗</div></article>\n<article class=\"service-editorial-item\"><div class=\"service-no\">03</div><div class=\"service-main\"><small>SCHEMATIC DESIGN</small><h3>계획설계</h3></div><p>대지 조건과 법규, 프로그램, 동선과 공간 구성을 검토해 프로젝트의 기본 방향을 설정하고 실제 설계로 이어질 수 있는 계획안을 구체화합니다.</p><div class=\"service-mark\">↗</div></article>\n<article class=\"service-editorial-item\"><div class=\"service-no\">04</div><div class=\"service-main\"><small>SUPERVISION</small><h3>감리 · 현장 검토</h3></div><p>설계 의도가 현장에서 정확하게 구현될 수 있도록 도서와 시공 내용을 비교·검토하고 주요 디테일과 품질 관련 사항을 확인해 프로젝트 완성도를 관리합니다.</p><div class=\"service-mark\">↗</div></article>\n<article class=\"service-editorial-item\"><div class=\"service-no\">05</div><div class=\"service-main\"><small>COORDINATION</small><h3>협업 프로세스 관리</h3></div><p>원설계사·시공사·관련 분야 간 협의 내용을 체계적으로 정리하고 도면 이슈를 추적해 원활한 프로젝트 진행을 지원합니다.</p><div class=\"service-mark\">↗</div></article>\n</div><section class=\"bim-lineup bim-editorial\" aria-labelledby=\"grooBimServiceTitle\"><div class=\"bim-editorial-header\"><div><div class=\"eyebrow\">BIM SERVICES</div><h2 id=\"grooBimServiceTitle\">그루터기 <em>BIM 서비스</em></h2></div><p>설계 정보를 하나의 모델로 연결하고,<br/>검토와 협업의 정확도를 높입니다.</p></div><div class=\"bim-visual bim-visual-image\"><img src=\"assets/image-4e29b89f59f84b1d.webp\" alt=\"고층 건물의 구조를 표현한 BIM 와이어프레임 이미지\" width=\"1145\" height=\"1374\" loading=\"lazy\"></div><div class=\"bim-copy\"><div class=\"bim-row\"><b>B/01</b><div><strong>BIM 전환설계</strong><p>2D 실시설계 도서를 BIM 모델로 전환하여 설계 정보를 입체적으로 검토합니다</p></div></div><div class=\"bim-row\"><b>B/02</b><div><strong>간섭 검토 · 물량 검토</strong><p>모델 기반 간섭과 주요 물량을 확인하여 시공 단계의 오류와 재도면 발생을 줄입니다</p></div></div><div class=\"bim-row\"><b>B/03</b><div><strong>BIM 기반 구조 검토</strong><p>구조 시스템과 주요 부재 관계를 모델에서 확인하고 관련 분야 협의를 지원합니다</p></div></div></div></section></div></section></section>\n\n<section class=\"page\" id=\"collaboration\">\n<div class=\"page-hero business-services-hero page-hero-visual\" style=\"--hero-image-position:center 53%;--hero-image-mobile-position:68% center\"><div class=\"page-hero-background\" aria-hidden=\"true\"><img alt=\"\" data-page-visual=\"business\"/></div><div class=\"container\"><div class=\"eyebrow\">BUSINESS</div><h1>Professional<br/><em>Services</em></h1><p>실시설계와 BIM을 중심으로 프로젝트 전 과정의 정확도와 완성도를 높입니다</p></div></div>\n<nav class=\"section-scroll-tabs business-scroll-tabs\" aria-label=\"비즈니스 섹션\"><div class=\"container\"><a href=\"#collaboration\">협업 업무</a><a href=\"#business-services\">서비스</a></div></nav>\n  <section class=\"section collaboration-process-section\">\n    <div class=\"container\">\n      <div class=\"collaboration-process-head\">\n        <div>\n          <div clas \" loading=\"${loading}\">`;}\nconst PROJECTS = (()=>{\n  const source=parent.GROO_PROJECTS;\n  const issues=[];\n  const seen=new Set();\n  const categories=['공동주택','주상복합','오피스텔','숙박시설','일반건물','오피스'];\n  if(!Array.isArray(source)) issues.push('GROO_PROJECTS는 배열이어야 합니다');\n  const items=(Array.isArray(source)?source:[]).flatMap((raw,index)=>{\n    if(!raw||typeof raw!=='object'){issues.push(`프로젝트 ${index+1}: 데이터 형식 확인`);return [];}\n    const p={sub:'',year:'',area:'',img:'',partner:'',location:'',scale:'',gallery:[],keywords:[],...raw};\n    p.no=String(p.no??'').trim();\n    p.title=String(p.title??'').trim();\n    if(!/^\\d+$/.test(p.no)||!p.title||!categories.includes(p.cat)){\n      issues.push(`프로젝트 ${index+1}: no, title, cat 확인`);return [];\n    }\n    if(seen.has(p.no)){issues.push(`프로젝트 번호 중복: ${escModal(p.no)}`);return [];}\n    p.work=(Array.isArray(p.work)?p.work:typeof p.work==='string'?[p.work]:['실시설계'])\n      .map(w=>({'계획설계':'계획','해체감리':'감리'}[w]||w));\n    if(!p.work.length||p.work.some(w=>!['실시설계','BIM','계획','감리'].includes(w))){\n      issues.push(`프로젝트 ${escModal(p.no)}: work 확인`);return [];\n    }\n    seen.add(p.no);\n    p.cat=p.cat==='일반건물'?'오피스':p.cat;\n    for(const field of ['sub','year','area','partner','location','scale','siteArea','buildingArea','client','use','architectTeam','status']) p[field]=String(p[field]??'');\n    p.gallery=Array.isArray(p.gallery)?p.gallery.filter(v=>typeof v==='string'&&v.trim()):[];\n    p.keywords=Array.isArray(p.keywords)?p.keywords:[];\n    p.img=typeof p.img==='string'?p.img:'';\n    p.detailCover=typeof p.detailCover==='string'?p.detailCover:'';\n    const permission=typeof parent.grooProjectImagePermission==='function' ? parent.grooProjectImagePermission(p) : null;\n    p.imageAllowed=Boolean(permission) && p.imageAllowed!==false;\n    p.imagePermissionKey=permission?.key||'';\n    if(p.imageAllowed){\n      const resolve=typeof parent.grooProjectImageAsset==='function' ? parent.grooProjectImageAsset : value=>value.startsWith('groo-image:')?'':value;\n      p.img=resolve(p.img);\n      p.detailCover=resolve(p.detailCover);\n      p.gallery=p.gallery.map(resolve).filter(Boolean);\n    }else{p.img='';p.detailCover='';p.gallery=[];}\n    return [p];\n  });\n  parent.GROO_PROJECT_DATA_ERRORS=issues;\n  if(issues.length)console.error('GROO 프로젝트 데이터 확인',issues);\n  return items;\n})();\n\n// ============================================================\n// PROJECT DATA SYSTEM\n// 새 프로젝트는 바깥 HTML 상단 window.GROO_PROJECTS에 한 번만 추가합니다.\n// 기본 업무는 실시설계이며, 다른 업무는 work:[\"BIM\"] / [\"계획\"] / [\"감리\"]처럼 지정합니다.\n// 프로젝트 건수·필터는 데이터에서 계산하며 협업사 목록은 독립적으로 유지합니다.\n// ============================================================\nconst COLLAB_PARTNERS=[\"정림건축\", \"하람건축\", \"삼우CM\", \"건축사사무소 미작\", \"HAPLUS\", \"ITM\", \"KG엔지니어링\", \"한림건축\"];\nconst WORK_PAGE_MAP={\n  'BIM':{mount:'bimProjectArchive',title:'BIM 프로젝트'},\n  '계획':{mount:'planningProjectArchive',title:'계획설계 프로젝트'},\n  '감리':{mount:'supervisionProjectArchive',title:'감리 프로젝트'}\n};\nfunction projectWorks(p){\n  if(Array.isArray(p.work)&&p.work.length) return p.work;\n  if(typeof p.work==='string'&&p.work.trim()) return [p.work.trim()];\n  return ['실시설계'];\n}\nfunction projectAreaNumber(p){\n  if(Number.isFinite(p.areaM2)) return p.areaM2;\n  const n=Number(String(p.area||'').replace(/[^0-9.]/g,''));\n  return Number.isFinite(n)?n:0;\n}\nfunction executionProjects(){return PROJECTS.filter(p=>projectWorks(p).includes('실시설계'));}\nfunction projectsByWork(work){return PROJECTS.filter(p=>projectWorks(p).includes(work));}\nfunction formatArea(n){return Math.round(n).toLocaleString('ko-KR')+'m²';}\nfunction renderCollaborationStats(){\n  const grid=document.getElementById('partnerStatsGrid'); if(!grid)return;\n  grid.innerHTML=COLLAB_PARTNERS.map((name,i)=>`<article class=\"collab-partner-chip\"><small>${String(i+1).padStart(2,'0')}</small><span>${escModal(name)}</span></article>`).join('');\n}\nfunction renderWorkArchive(work){\n  const cfg=WORK_PAGE_MAP[work]; if(!cfg)return; const mount=document.getElementById(cfg.mount); if(!mount)return;\n  const items=sortProjectsNewest(projectsByWork(work));\n  const chapterMeta={\n    'BIM':{no:'02',ko:'BIM',en:'BIM'},\n    '계획':{no:'03',ko:'계획설계',en:'PLANNING DESIGN'},\n    '감리':{no:'04',ko:'감리',en:'SUPERVISION'}\n  }[work]||{no:'',ko:work,en:'PROJECTS'};\n  const chapter=`<div class=\"project-scroll-chapter\"><div><small>PROJECTS / ${chapterMeta.no}</small><h2>${chapterMeta.ko}</h2></div><span>${chapterMeta.en}</span></div>`;\n  const content=items.length\n    ? `<div class=\"project-grid\">${items.map(card).join('')}</div>`\n    : `<div class=\"update-box\"><small>PROJECT ARCHIVE</small><p>프로젝트 자료를 정리하고 있습니다.<br/>업데이트 예정입니다.</p></div>`;\n  mount.innerHTML=chapter+content;\n  setTimeout(observeReveals,30);\n}\nfunction updateExecutionCounts(){\n  const items=executionProjects();\n  const total=document.getElementById('executionTotalCount'); if(total) total.textContent=`${items.length} PROJECT${items.length===1?'':'S'}`;\n  document.querySelectorAll('#executionCategoryNav button[data-exec-category]').forEach(btn=>{\n    const cat=btn.dataset.execCategory; const meta=executionCategoryMeta[cat]||{}; const source=meta.sourceCat||cat;\n    const count=items.filter(p=>p.cat===source).length;\n    const label=btn.dataset.label||btn.textContent.trim(); btn.dataset.label=label;\n    btn.innerHTML=`${label}<span class=\"count\">${count}</span>`;\n  });\n}\nfunction refreshProjectDrivenUI(){renderCollaborationStats();updateExecutionCounts();Object.keys(WORK_PAGE_MAP).forEach(renderWorkArchive);renderExecutionCategory(currentExecutionCategory);}\n\nconst projectMenu = document.getElementById('projectMenu');\nconst detail = document.getElementById('detail');\nconst nav = document.getElementById('nav');\nconst menu = document.getElementById('menu');\nconst header = document.getElementById('header');\n\n// V16 entry screen\nconst entryScreen=document.getElementById('entryScreen');\nfunction enterSite(){\n  if(!entryScreen || entryScreen.classList.contains('is-hidden')) return;\n  if(location.hash !== '#home') location.hash='home';\n  entryScreen.classList.add('is-hidden');\n  document.body.classList.remove('entry-lock');\n}\nif(entryScreen){\n  const directRoute=location.hash && location.hash !== '#home';\n  if(directRoute) entryScreen.classList.add('is-hidden');\n  else document.body.classList.add('entry-lock');\n  document.getElementById('entryLogo').addEventListener('click',enterSite);\n  document.getElementById('entryCompany').addEventListener('click',enterSite);\n  if(!directRoute) setTimeout(enterSite, 2000);\n}\n\nconst NEWS_ARCHIVE=[{\"key\":\"2026-09-08\",\"id\":\"02\",\"category\":\"현장답사\",\"title\":\"울산광역시 남구 삼산동 주상복합 현장답사\",\"lead\":\"주상복합 · 울산광역시 남구 삼산동\",\"body\":\"\",\"image\":\"\",\"details\":[[\"답사 대상\",\"주상복합\"],[\"위치\",\"울산광역시 남구 삼산동\"]]},{\"key\":\"2026-09-06\",\"id\":\"01\",\"category\":\"전문교육\",\"title\":\"안양건축문화제 건축사 전문교육 (AI, 이관용건축사)\",\"lead\":\"AI · 이관용 건축사\",\"body\":\"\",\"image\":\"assets/image-cc8831504ed979df.webp\",\"imageAlt\":\"2026 안양건축문화제 안내 포스터\",\"details\":[[\"행사\",\"안양건축문화제\"],[\"교육\",\"건축사 전문교육\"],[\"주제\",\"AI\"],[\"강사\",\"이관용 건축사\"]]}];\nconst NEWS_POSTS=NEWS_ARCHIVE.map(item=>({...item,date:item.key.replace(/-/g,'.')}));\nconst NEWS_SCHEDULE=NEWS_ARCHIVE.map(x=>({date:x.key,title:x.title,id:x.id,category:x.category,lead:x.lead}));\nlet newsCalendarToday=new Date();\nlet newsCalendarDate=new Date(newsCalendarToday.getFullYear(),newsCalendarToday.getMonth(),1);\nlet newsListPage=0;\nconst NEWS_PER_PAGE=4;\nconst newsCalendarGrid=document.getElementById('newsCalendarGrid');\nconst newsScheduleList=document.getElementById('newsScheduleList');\nconst newsCalendarLabel=document.getElementById('newsCalendarLabel');\nconst newsReferenceList=document.getElementById('newsReferenceList');\nconst newsListMonthLabel=document.getElementById('newsListMonthLabel');\nconst newsListPageLabel=document.getElementById('newsListPage');\nconst newsListPrev=document.getElementById('newsListPrev');\nconst newsListNext=document.getElementById('newsListNext');\nconst monthNames=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];\nconst monthShort=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n\nfunction newsMonthKey(){\n  return `${newsCalendarDate.getFullYear()}-${String(newsCalendarDate.getMonth()+1).padStart(2,'0')}`;\n}\nfunction renderNewsMonthList(resetPage=false){\n  if(!newsReferenceList)return;\n  if(resetPage) newsListPage=0;\n  const all=[...NEWS_ARCHIVE].sort((a,b)=>b.key.localeCompare(a.key));\n  const perPage=6;\n  const totalPages=Math.max(1,Math.ceil(all.length/perPage));\n  newsListPage=Math.max(0,Math.min(newsListPage,totalPages-1));\n  const items=all.slice(newsListPage*perPage,(newsListPage+1)*perPage);\n  newsReferenceList.innerHTML=items.length?items.map((x,i)=>{\n    const dt=new Date(x.key+'T00:00:00');\n    const day=String(dt.getDate()).padStart(2,'0');\n    const mon=monthShort[dt.getMonth()];\n    const year=dt.getFullYear();\n    return `<a class=\"news-reference-item\" href=\"#news-${x.key}\" data-news-key=\"${x.key}\" style=\"animation-delay:${Math.min(i,8)*35}ms\"><div class=\"news-date\"><strong>${day}</strong><span>${mon} ${year}</span></div><div class=\"news-item-copy\"><small>${x.category}</small><h2>${x.title}</h2><p>${x.lead}</p><b>DETAIL VIEW</b></div></a>`;\n  }).join(''):'<div class=\"news-month-empty\">등록된 소식이 없습니다</div>';\n  let controls=document.getElementById('newsPageControls');\n  if(!controls){\n    controls=document.createElement('div');\n    controls.id='newsPageControls';\n    controls.className='news-page-controls';\n    document.querySelector('.news-continuous-toolbar')?.appendChild(controls);\n  }\n  controls.innerHTML=`<button type=\"button\" aria-label=\"이전 뉴스 페이지\" ${newsListPage===0?'disabled':''}>←</button><span>${newsListPage+1} / ${totalPages}</span><button type=\"button\" aria-label=\"다음 뉴스 페이지\" ${newsListPage>=totalPages-1?'disabled':''}>→</button>`;\n  const btns=controls.querySelectorAll('button');\n  btns[0]?.addEventListener('click',()=>{if(newsListPage>0){newsListPage--;renderNewsMonthList();document.getElementById('news')?.scrollIntoView({behavior:'smooth',block:'start'});}});\n  btns[1]?.addEventListener('click',()=>{if(newsListPage<totalPages-1){newsListPage++;renderNewsMonthList();document.getElementById('news')?.scrollIntoView({behavior:'smooth',block:'start'});}});\n}\nfunction renderNewsCalendar(resetList=false){\n  if(!newsCalendarGrid||!newsCalendarLabel)return;\n  const now=new Date();\n  const monthChanged=now.getFullYear()!==newsCalendarToday.getFullYear()||now.getMonth()!==newsCalendarToday.getMonth();\n  newsCalendarToday=now;\n  if(monthChanged) newsCalendarDate=new Date(now.getFullYear(),now.getMonth(),1);\n  const todayKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;\n  const y=newsCalendarDate.getFullYear(),m=newsCalendarDate.getMonth();\n  newsCalendarLabel.textContent=`${y}. ${String(m+1).padStart(2,'0')}`;\n  const first=new Date(y,m,1);\n  const days=new Date(y,m+1,0).getDate();\n  const mondayIndex=(first.getDay()+6)%7;\n  const eventMap=new Map(NEWS_SCHEDULE.map(e=>[e.date,e]));\n  let html='';\n  for(let i=0;i<mondayIndex;i++)html+='<span class=\"calendar-day is-empty\"></span>';\n  for(let d=1;d<=days;d++){\n    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n    const event=eventMap.get(key);\n    const isToday=key===todayKey;\n    const todayClass=isToday?' is-today':'';\n    const todayAttr=isToday?' aria-current=\"date\"':'';\n    html+=event\n      ? `<button type=\"button\" class=\"calendar-day has-event${todayClass}\"${todayAttr} data-news-key=\"${key}\" data-news-id=\"${event.id}\" title=\"${event.title}\" aria-label=\"${isToday?'오늘, ':''}${d}일 ${event.title}\">${d}</button>`\n      : `<span class=\"calendar-day${todayClass}\"${todayAttr}${isToday?' title=\"오늘\" aria-label=\"오늘, '+d+'일\"':''}>${d}</span>`;\n  }\n  newsCalendarGrid.innerHTML=html;\n  const monthEvents=NEWS_SCHEDULE.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).sort((a,b)=>b.date.localeCompare(a.date));\n  newsScheduleList.innerHTML=monthEvents.length\n    ? monthEvents.map(e=>`<button type=\"button\" data-news-key=\"${e.date}\" data-news-id=\"${e.id}\"><time>${e.date.slice(5).replace('-','.')}</time><span>${e.title}</span></button>`).join('')\n    : '<p>등록된 일정이 없습니다</p>';\n  renderNewsMonthList(resetList||monthChanged);\n}\ndocument.getElementById('newsCalendarPrev')?.addEventListener('click',()=>{newsCalendarDate=new Date(newsCalendarDate.getFullYear(),newsCalendarDate.getMonth()-1,1);renderNewsCalendar(true);});\ndocument.getElementById('newsCalendarNext')?.addEventListener('click',()=>{newsCalendarDate=new Date(newsCalendarDate.getFullYear(),newsCalendarDate.getMonth()+1,1);renderNewsCalendar(true);});\nnewsListPrev?.addEventListener('click',()=>{if(newsListPage>0){newsListPage--;renderNewsMonthList();}});\nnewsListNext?.addEventListener('click',()=>{newsListPage++;renderNewsMonthList();});\nrenderNewsCalendar(true);\n\nfunction refreshNewsCalendarToday(){\n  const now=new Date();\n  if(now.getFullYear()!==newsCalendarToday.getFullYear()||now.getMonth()!==newsCalendarToday.getMonth()||now.getDate()!==newsCalendarToday.getDate()) renderNewsCalendar();\n}\nsetInterval(refreshNewsCalendarToday,60000);\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden) refreshNewsCalendarToday();});\nwindow.addEventListener('focus',refreshNewsCalendarToday);\n\n\nfunction newsArchivePost(item){\n  return {...item,date:item.key.replace(/-/g,'.')};\n}\nfunction newsFactMarkup(post){\n  return `<dl class=\"groo-news-card-facts\">${(post.details||[]).map(([label,value])=>`<div><dt>${escModal(label)}</dt><dd>${escModal(value)}</dd></div>`).join('')}</dl>`;\n}\nfunction renderNewsDetail(post){\n  const shell=document.getElementById('newsDetailShell');if(!shell||!post)return;\n  shell.innerHTML=`<div class=\"news-detail-hero\"><div class=\"container\"><div class=\"eyebrow\">${escModal(post.category)} · ${escModal(post.date)}</div><h1>${escModal(post.title)}</h1><p>${escModal(post.lead)}</p></div></div><section class=\"container news-detail-content\">${post.image?`<figure><img src=\"${escModal(post.image)}\" alt=\"${escModal(post.imageAlt||post.title)}\"></figure>`:''}<div class=\"news-detail-copy\">${newsFactMarkup(post)}</div><div class=\"detail-nav\"><a href=\"#news\">← 소식 목록</a><a href=\"#contact\">CONTACT →</a></div></section>`;\n}\n\nfunction projectArchitect(p){\n  const name=(p.partner||'').trim();\n  return name || (p.publicData?'공개 자료에 미기재':'정보 확인 중');\n}\nfunction architectCard(p){\n  if(p.hideArchitect) return '';\n  const pending=!(p.partner||'').trim();\n  return `<div class=\"project-architect${pending?' is-pending':''}\"><span>설계사</span><strong>${escModal(projectArchitect(p))}</strong></div>`;\n}\n\nfunction sortProjectsNewest(items){return items.slice().sort((a,b)=>(Number(b.year)||0)-(Number(a.year)||0)||Number(Boolean(b.img))-Number(Boolean(a.img))||Number(a.no)-Number(b.no));}\nfunction card(p) {\n  const media=p.img?`<a href=\"#project-${escModal(p.no)}\" class=\"project-media\"><img src=\"${escModal(p.img)}\" alt=\"${escModal(p.title)}\" loading=\"lazy\"><span class=\"project-overlay\"><span class=\"view\">VIEW PROJECT ↗</span></span></a>`:`<a href=\"#project-${escModal(p.no)}\" class=\"project-media project-media-empty\" aria-label=\"${escModal(p.title)} 상세보기\">${pendingProjectImage(\"lazy\")}</a>`;\n  const cardUse=p.cat==='오피스'?(p.use||'일반건물'):p.cat;\n  const role=p.workLabel||projectWorks(p)[0]||'PROJECT';\n  return `<article class=\"project-card reveal\" data-project-no=\"${escModal(p.no)}\">${media}<div class=\"project-info\"><div><div class=\"project-cat\">${escModal(p.no==='043'?'단독주택':cardUse)}</div><h3>${escModal(p.title)}</h3><p>${escModal(p.sub)}</p><div class=\"project-card-meta\">${escModal(p.year)} · ${escModal(cardUse)} · ${escModal(role)}</div>${architectCard(p)}</div><span class=\"year\">${escModal(p.year)}</span></div></article>`;\n}\nprojectMenu.innerHTML = `<a href=\"#projects-execution\">실시설계</a><a href=\"#business-bim\">BIM</a><a href=\"#business-design\">계획설계</a><a href=\"#business-supervision\">감리</a>`;\n\n\n// 실시설계 프로젝트 아카이브 — 카테고리 / 연도 / 검색\nconst executionCategoryNav=document.getElementById('executionCategoryNav');\nconst executionProjectGrid=document.getElementById('executionProjectGrid');\nconst executionYear=document.getElementById('executionYear');\nconst executionSearch=document.getElementById('executionSearch');\nconst projectArchiveTitle=document.getElementById('projectArchiveTitle');\nconst projectArchiveEyebrow=document.getElementById('projectArchiveEyebrow');\n\nconst executionCategoryMeta={\n  '공동주택':{sourceCat:'공동주택',index:'01',en:'RESIDENTIAL'},\n  '주상복합':{sourceCat:'주상복합',index:'02',en:'MIXED-USE'},\n  '오피스텔':{sourceCat:'오피스텔',index:'03',en:'OFFICETEL'},\n  '숙박시설':{sourceCat:'숙박시설',index:'04',en:'HOSPITALITY'},\n  '일반건물':{sourceCat:'오피스',index:'05',en:'GENERAL BUILDING'}\n};\n\nlet currentExecutionCategory=parent.GROO_PROJECT_LIST_STATE?.category||'공동주택';\n\nfunction archiveCard(p){\n  const displayCategory=p.cat==='오피스'?(p.use||'일반건물'):p.cat;\n  const partner=(p.partner||'').trim()||'협업사 미정';\n  const media=p.img\n    ? `<img src=\"${escModal(p.img)}\" alt=\"${escModal(p.title)}\" loading=\"lazy\">`\n    : `${pendingProjectImage()}`;\n  return `<article class=\"projects-ref-card reveal\" data-project-no=\"${escModal(p.no)}\">\n    <a class=\"projects-ref-media${p.img?'':' project-media-pending'}\" href=\"#project-${escModal(p.no)}\" aria-label=\"${escModal(p.title)} 상세보기\">${media}<span class=\"projects-ref-hover\"><span class=\"hover-view\">VIEW PROJECT ↗</span></span></a>\n    <div class=\"projects-ref-meta-top\"><span>${escModal(displayCategory)}</span><time>${p.year||''}</time></div>\n    <h3><a href=\"#project-${escModal(p.no)}\">${escModal(p.title)}</a></h3>\n    <p>${escModal(p.sub||partner)}</p>\n    <div class=\"projects-ref-foot\">${escModal([p.year,displayCategory,'실시설계'].filter(Boolean).join(' · '))}</div>${architectCard(p)}\n  </article>`;\n}\n\nfunction updateExecutionArchiveSummary(items){\n  const totalEl=document.getElementById('executionArchiveTotal');\n  const areaEl=document.getElementById('executionArchiveArea');\n  const categoryEl=document.getElementById('executionArchiveCategory');\n  const yearEl=document.getElementById('executionArchiveYear');\n  const published=items.filter(p=>Number.isFinite(p.areaM2)||/[0-9]/.test(String(p.area||'')));\n  const rounded=Math.round(published.reduce((sum,p)=>sum+projectAreaNumber(p),0));\n  if(totalEl) totalEl.textContent=items.length.toLocaleString('ko-KR');\n  if(categoryEl) categoryEl.textContent=currentExecutionCategory;\n  if(yearEl) yearEl.textContent=executionYear?.value||'전체 연도';\n  if(areaEl) areaEl.textContent=items.length===0 ? '—' : published.length===0 ? '면적 미공개' : `${published.length<items.length?'공개 면적':'약'} ${rounded.toLocaleString('ko-KR')}㎡`;\n}\n\nfunction fillExecutionFilters(){\n  if(!executionYear)return;\n  const items=executionProjects();\n  const years=[...new Set(items.map(p=>p.year).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));\n  executionYear.innerHTML='<option value=\"\">전체 연도</option>'+years.map(v=>`<option value=\"${v}\">${v}</option>`).join('');\n}\n\nfunction renderExecutionCategory(cat=currentExecutionCategory){\n  if(!executionProjectGrid)return;\n  currentExecutionCategory=cat;\n  const meta=executionCategoryMeta[cat]||executionCategoryMeta['공동주택'];\n  let matches=executionProjects().filter(p=>p.cat===meta.sourceCat);\n  if(executionYear?.value) matches=matches.filter(p=>String(p.year)===executionYear.value);\n\n  const query=(executionSearch?.value||'').trim().toLocaleLowerCase('ko');\n  if(query){\n    matches=matches.filter(p=>{\n      const haystack=[\n        p.title,p.sub,p.location,p.use,p.cat,p.year,p.designYear,p.sourceFolder,\n        ...(Array.isArray(p.keywords)?p.keywords:[])\n      ].filter(Boolean).join(' ').toLocaleLowerCase('ko');\n      return haystack.includes(query);\n    });\n  }\n\n  matches=sortProjectsNewest(matches);\n\n  executionProjectGrid.innerHTML=matches.length\n    ? matches.map(archiveCard).join('')\n    : `<div class=\"projects-ref-empty\">${PROJECTS.length?'조건에 맞는 프로젝트가 없습니다':'프로젝트 자료를 준비하고 있습니다'}</div>`;\n\n  if(projectArchiveTitle) projectArchiveTitle.textContent=cat;\n  if(projectArchiveEyebrow) projectArchiveEyebrow.textContent=`${meta.index} / ${meta.en}`;\n  updateExecutionArchiveSummary(matches);\n\n  executionCategoryNav?.querySelectorAll('button[data-exec-category]').forEach(btn=>\n    btn.classList.toggle('active',btn.dataset.execCategory===cat)\n  );\n  setTimeout(observeReveals,30);\n}\n\nexecutionCategoryNav?.addEventListener('click',e=>{\n  const btn=e.target.closest('button[data-exec-category]');\n  if(!btn)return;\n  renderExecutionCategory(btn.dataset.execCategory);\n});\nexecutionYear?.addEventListener('change',()=>renderExecutionCategory());\nexecutionSearch?.addEventListener('input',()=>renderExecutionCategory());\nexecutionSearch?.addEventListener('keydown',e=>{\n  if(e.key==='Escape'){\n    executionSearch.value='';\n    renderExecutionCategory();\n    executionSearch.blur();\n  }\n});\nfillExecutionFilters();\nconst savedProjectList=parent.GROO_PROJECT_LIST_STATE;\nif(savedProjectList?.restore){\n  if(executionYear) executionYear.value=savedProjectList.year||'';\n  if(executionSearch) executionSearch.value=savedProjectList.search||'';\n}\n\n\n\n\nconst PROJECT_LIST_ROUTES=['projects-execution','business-bim','business-design','business-supervision'];\nfunction projectListContext(p){\n  const saved=parent.GROO_PROJECT_LIST_STATE;\n  if(saved&&saved.projectNo===p.no&&PROJECT_LIST_ROUTES.includes(saved.route)) return saved;\n  const works=projectWorks(p);\n  const route=works.includes('실시설계')?'projects-execution':works.includes('BIM')?'business-bim':works.includes('계획')?'business-design':'business-supervision';\n  return {route,projectNo:p.no,category:p.cat==='오피스'?'일반건물':p.cat,year:'',search:'',scrollY:null,restore:false};\n}\nfunction replaceAppRoute(route){\n  const next=new URL(window.location.href);\n  next.hash=route;\n  try{history.replaceState(null,'',next.href);}\n  catch(_){if(location.hash!==next.hash)location.hash=next.hash;}\n}\nfunction navigateProjectPage(route){\n  setActive('#'+route);\n  replaceAppRoute(route);\n  parent.postMessage({type:'groo-project-navigation',route},'*');\n}\nfunction openProjectPage(p,sourcePage){\n  const fallback=projectListContext(p);\n  parent.GROO_PROJECT_LIST_STATE={\n    route:PROJECT_LIST_ROUTES.includes(sourcePage)?sourcePage:fallback.route,\n    projectNo:p.no,\n    category:currentExecutionCategory,\n    year:executionYear?.value||'',\n    search:executionSearch?.value||'',\n    scrollY:window.scrollY,\n    restore:false\n  };\n  closeGrooCardModal();\n  navigateProjectPage('project-'+p.no);\n}\nfunction returnToProjectList(){\n  const no=location.hash.replace(/^#project-/,'');\n  const p=PROJECTS.find(item=>item.no===no);\n  if(!p){navigateProjectPage('projects-execution');return;}\n  const context=projectListContext(p);\n  parent.GROO_PROJECT_LIST_STATE={...context,restore:true};\n  if(executionCategoryMeta[context.category]) currentExecutionCategory=context.category;\n  if(executionYear) executionYear.value=context.year||'';\n  if(executionSearch) executionSearch.value=context.search||'';\n  navigateProjectPage(context.route);\n}\n\nfunction supervisionOverviewFacts(p){\n  const demolition=Boolean(p.demolitionPermit||p.demolitionPeriod||String(p.workLabel||'').includes('해체'));\n  return [\n    ['대지위치',p.location??''],\n    ['용도',p.use??''],\n    ['규모',p.scale??''],\n    ['대지면적',p.siteArea??''],\n    ['건축면적',p.buildingArea??''],\n    ['연면적',p.area??''],\n    ['프로젝트 연도',p.year??''],\n    ['업무',p.workLabel||projectWorks(p).join(' · ')],\n    [demolition?'해체허가':'허가',demolition?(p.demolitionPermit??''):(p.permit??'')],\n    [demolition?'해체공사 기간':'공사 기간',demolition?(p.demolitionPeriod??''):(p.supervisionPeriod??'')]\n  ];\n}\n\nfunction projectOverviewFacts(p){\n  if(projectWorks(p).includes('감리'))return supervisionOverviewFacts(p);\n  const use=p.use||(p.cat==='오피스'?'일반건물':p.cat)||'';\n  const unitLabel=/세대/.test(p.units||'')?'세대수':p.cat==='오피스텔'&&/실/.test(p.units||'')?'호실수':/기숙사/.test(p.units||'')?'기숙사 규모':/실/.test(p.units||'')?'객실수':'세대수 / 객실수';\n  return [\n    ['대지위치',p.location],\n    ['용도',use],\n    ['규모',p.scale],\n    ['대지면적',p.siteArea],\n    ['건축면적',p.buildingArea],\n    ['연면적',p.area],\n    [unitLabel,p.units],\n    ['프로젝트 연도',p.year],\n    ['설계연도',p.designYear],\n    ['사업기간',p.businessPeriod],\n    ['공사기간',p.constructionPeriod],\n    ['준공 / 진행',p.completion],\n    ['설계사',p.hideArchitect?'':projectArchitect(p)],\n    ['구조',p.structure],\n    ['건폐율',p.buildingCoverage],\n    ['용적률',p.floorAreaRatio],\n    ['업무',p.publicData?'':(p.workLabel||projectWorks(p).join(' · '))],\n    ['발주',p.client],\n    ['설계 조직',p.architectTeam],\n    ['진행 상태',p.status===p.completion?'':p.status],\n    ['허가',p.permit],\n    ['공사 기간',p.supervisionPeriod],\n    ['해체허가',p.demolitionPermit],\n    ['해체공사 기간',p.demolitionPeriod]\n  ].filter(([,value])=>value!==undefined&&value!==null&&String(value).trim());\n}\n\n\nfunction scrollProjectStart(id){\n  const target=document.getElementById(id);if(!target)return;\n  const header=document.getElementById('header')?.offsetHeight||70;\n  const top=id==='projects-execution'?0:Math.max(0,target.getBoundingClientRect().top+scrollY-header);\n  window.scrollTo({top,behavior:'instant'});\n}\n\nfunction renderDetail(p) {\n  const returnRoute=projectListContext(p).route;\n  const isSupervision=projectWorks(p).includes('감리');\n  const galleryImages=[p.detailCover,p.img,...(p.gallery||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);\n  const hasGallery=galleryImages.length>1;\n  const detailImage=galleryImages.length?`${hasGallery?`<div class=\"detail-gallery\" data-gallery-no=\"${escModal(p.no)}\">`:''}<figure class=\"detail-image\"><img ${hasGallery?'id=\"detailGalleryImg\"':''} src=\"${escModal(galleryImages[0])}\" alt=\"${escModal(p.title)}\"></figure>${hasGallery?`<div class=\"detail-gallery-controls\"><div class=\"detail-gallery-arrows\"><button class=\"detail-gallery-btn\" id=\"detailGalleryPrev\" type=\"button\" aria-label=\"이전 이미지\">←</button><button class=\"detail-gallery-btn\" id=\"detailGalleryNext\" type=\"button\" aria-label=\"다음 이미지\">→</button></div><div class=\"detail-gallery-dots\">${galleryImages.map((_,i)=>`<button class=\"detail-gallery-dot${i===0?' active':''}\" type=\"button\" data-gallery-index=\"${i}\" aria-label=\"이미지 ${i+1}\"></button>`).join('')}</div><div class=\"detail-gallery-count\"><span id=\"detailGalleryCurrent\">01</span> / ${String(galleryImages.length).padStart(2,'0')}</div></div><div class=\"detail-gallery-thumbs\">${galleryImages.map((src,i)=>`<button class=\"detail-gallery-thumb${i===0?' active':''}\" type=\"button\" data-gallery-index=\"${i}\" aria-label=\"이미지 ${i+1} 보기\"><img src=\"${escModal(src)}\" alt=\"\" loading=\"lazy\"></button>`).join('')}</div></div>`:''}`:'';\n  const fact=(label,value)=>(isSupervision||value)?`<div><b>${label}</b><span>${escModal(value??'')}</span></div>`:'';\n  const titleMarkup=`<div class=\"eyebrow\">PROJECT ${escModal(p.no)}</div><h1 tabindex=\"-1\">${escModal(p.title)}</h1>`;\n  detail.innerHTML = `<div class=\"detail-hero\"><div class=\"container\">${titleMarkup}</div></div>\n  <section class=\"container project-detail-shell overview-detail${isSupervision?' supervision-detail':''}\">\n    <div class=\"project-detail-layout${galleryImages.length?'':' no-photo'}\">\n      <div class=\"project-detail-media\">\n        ${detailImage||`<figure class=\"detail-image project-pending-frame\">${pendingProjectImage(\"eager\")}</figure>`}\n        ${galleryImages.length&&p.imageSourceLabel?`<p class=\"project-photo-credit\">이미지 출처 · ${escModal(p.imageSourceLabel)}</p>`:''}\n      </div>\n      <div class=\"project-overview project-facts overview-combined\">\n        <div class=\"overview-title\"><div class=\"eyebrow\">OVERVIEW</div><h2>개요</h2></div>\n        <div class=\"overview-content\">\n          <div class=\"overview-facts\">${projectOverviewFacts(p).map(([label,value])=>fact(label,value)).join('')}</div>\n          ${p.overviewNotes?`<p class=\"project-overview-note\">${escModal(p.overviewNotes)}</p>`:''}\n          ${p.sourceUrl?`<a class=\"project-detail-source\" href=\"${escModal(p.sourceUrl)}\" target=\"_blank\" rel=\"noopener noreferrer\">${escModal(p.sourceLabel||'공식 프로젝트 자료')} ↗</a>`:''}\n        </div>\n      </div>\n    </div>\n    <nav class=\"project-detail-actions\" aria-label=\"프로젝트 상세 내비게이션\">\n      <a class=\"project-list-return\" data-project-back href=\"#${escModal(returnRoute)}\"><span aria-hidden=\"true\">←</span> 목록으로 돌아가기</a>\n    </nav>\n  </section>`;\n\n\n  if(hasGallery){\n    let galleryIndex=0;\n    const img=detail.querySelector('#detailGalleryImg');\n    const current=detail.querySelector('#detailGalleryCurrent');\n    const dots=[...detail.querySelectorAll('.detail-gallery-dot')];\n    const thumbs=[...detail.querySelectorAll('.detail-gallery-thumb')];\n    const showGalleryImage=(idx)=>{\n      galleryIndex=(idx+galleryImages.length)%galleryImages.length;\n      img.style.opacity='0';\n      window.setTimeout(()=>{img.src=galleryImages[galleryIndex];img.alt=`${p.title} 이미지 ${galleryIndex+1}`;img.style.opacity='1';},120);\n      current.textContent=String(galleryIndex+1).padStart(2,'0');\n      dots.forEach((d,i)=>d.classList.toggle('active',i===galleryIndex));\n      thumbs.forEach((t,i)=>t.classList.toggle('active',i===galleryIndex));\n      if(thumbs[galleryIndex]){const row=thumbs[galleryIndex].parentElement;row.scrollTo({left:thumbs[galleryIndex].offsetLeft-row.offsetLeft,behavior:'smooth'});}\n      };\n    img.style.transition='opacity .25s ease';\n    detail.querySelector('#detailGalleryPrev').addEventListener('click',()=>showGalleryImage(galleryIndex-1));\n    detail.querySelector('#detailGalleryNext').addEventListener('click',()=>showGalleryImage(galleryIndex+1));\n    dots.forEach((d,i)=>d.addEventListener('click',()=>showGalleryImage(i)));\n    thumbs.forEach((t,i)=>t.addEventListener('click',()=>showGalleryImage(i)));\n    let touchStartX=0;\n    img.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});\n    img.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>45)showGalleryImage(galleryIndex+(dx<0?1:-1));},{passive:true});\n  }\n}\n\nfunction setActive(hash) {\n  const id = hash.replace('#','') || 'home';\n  const ABOUT_GROUP=['company','history','milestones','organization','certificates'];\n  const BUSINESS_GROUP=['business-services','collaboration'];\n  const PROJECT_GROUP=['projects-execution','business-bim','business-design','business-supervision'];\n  const group = ABOUT_GROUP.includes(id)?'about':BUSINESS_GROUP.includes(id)?'business':PROJECT_GROUP.includes(id)?'projects':'';\n\n  document.body.classList.toggle('home', id==='home');\n  document.body.classList.toggle('project-detail-view',id.startsWith('project-'));\n  document.body.classList.remove('group-about','group-business','group-projects');\n  if(group) document.body.classList.add('group-'+group);\n\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  detail.classList.remove('active');\n\n  if(id.startsWith('news-')) {\n    const key=id.slice(5);\n    const archive=NEWS_ARCHIVE.find(x=>x.key===key);\n    const post=archive?newsArchivePost(archive):NEWS_POSTS.find(x=>x.id===key);\n    const page=document.getElementById('news-detail');\n    if(post&&page){renderNewsDetail(post);page.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}\n  } else if(id.startsWith('project-')) {\n    const p=PROJECTS.find(x=>x.no===id.split('-')[1]);\n    if(p) {renderDetail(p);detail.classList.add('active');window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>detail.querySelector('h1')?.focus({preventScroll:true}));}\n    else {replaceAppRoute('projects-execution');parent.postMessage({type:'groo-sync',route:'projects-execution'},'*');setActive('#projects-execution');}\n  } else if(group) {\n    const ids=group==='about'?ABOUT_GROUP:group==='business'?BUSINESS_GROUP:PROJECT_GROUP;\n    ids.forEach(pid=>document.getElementById(pid)?.closest('.page')?.classList.add('active'));\n\n    if(group==='projects'){\n      updateExecutionCounts();\n      renderExecutionCategory(currentExecutionCategory||'공동주택');\n      renderWorkArchive('BIM');\n      renderWorkArchive('계획');\n      renderWorkArchive('감리');\n    }\n    if(group==='business') renderCollaborationStats();\n\n    requestAnimationFrame(()=>{\n      const target=document.getElementById(id);\n      const restore=parent.GROO_PROJECT_LIST_STATE;\n      if(group==='projects'&&restore?.restore&&restore.route===id){\n        restore.restore=false;\n        requestAnimationFrame(()=>{\n          if(Number.isFinite(restore.scrollY)) window.scrollTo({top:restore.scrollY,behavior:'instant'});\n          else target?.scrollIntoView({behavior:'auto',block:'start'});\n          const link=document.querySelector(`[data-project-no=\"${restore.projectNo}\"] a`);\n          link?.focus({preventScroll:true});\n        });\n      }else if(target){\n        if(group==='projects')scrollProjectStart(id);\n        else if(id==='company'||id==='collaboration')window.scrollTo({top:0,behavior:'instant'});\n        else if(id==='organization')(target.querySelector('.org-title')||target).scrollIntoView({behavior:'smooth',block:'start'});\n        else target.scrollIntoView({behavior:'smooth',block:'start'});\n      }\n    });\n  } else {\n    const page=document.getElementById(id);\n    (page || document.getElementById('home')).classList.add('active');\n    const categoryPage=document.querySelector('#'+id+' [data-project-category]');\n    if(categoryPage){ const cat=categoryPage.dataset.projectCategory; categoryPage.innerHTML=sortProjectsNewest(PROJECTS.filter(p=>p.cat===cat)).map(card).join(''); }\n    if(id==='news') renderNewsCalendar?.();\n    window.scrollTo({top:0,behavior:'smooth'});\n  }\n  nav.classList.remove('open'); menu.classList.remove('open');\n  setTimeout(observeReveals,30);\n  document.dispatchEvent(new Event('groo-page-change'));\n}\nfunction observeReveals() {\n  const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});\n  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));\n}\nwindow.addEventListener('hashchange',()=>setActive(location.hash));\nwindow.addEventListener('scroll',()=>header.classList.toggle('scrolled',scrollY>30));\n\n\nrefreshProjectDrivenUI(); setActive(location.hash); observeReveals();\n\n\n\n// NEWS modal — project details use full pages\nconst grooCardModal=document.getElementById('grooCardModal');\nconst grooCardContent=document.getElementById('grooCardContent');\nconst grooCardDialog=document.getElementById('grooCardDialog');\nconst grooCardClose=document.getElementById('grooCardClose');\nlet grooCardReturnFocus=null;\nfunction closeGrooCardModal(){\n  if(!grooCardModal)return;\n  grooCardModal.classList.remove('open');\n  grooCardModal.setAttribute('aria-hidden','true');\n  document.body.classList.remove('groo-modal-lock');\n  grooCardReturnFocus?.focus({preventScroll:true});grooCardReturnFocus=null;\n}\nfunction showGrooCardModal(markup, galleryImages=[]){\n  if(!grooCardModal||!grooCardContent)return;\n  grooCardReturnFocus=document.activeElement;\n  grooCardContent.innerHTML=markup;\n  grooCardModal.classList.add('open');\n  grooCardModal.setAttribute('aria-hidden','false');\n  document.body.classList.add('groo-modal-lock');\n  grooCardDialog.scrollTop=0;\n  grooCardClose?.focus({preventScroll:true});\n  if(galleryImages.length>1){\n    const image=grooCardContent.querySelector('[data-groo-gallery-image]');\n    const counter=grooCardContent.querySelector('[data-groo-gallery-count]');\n    const dots=[...grooCardContent.querySelectorAll('[data-groo-gallery-index]')];\n    let current=0;\n    const show=n=>{\n      current=(n+galleryImages.length)%galleryImages.length;\n      image.src=galleryImages[current];\n      image.alt=`사진 ${current+1} / ${galleryImages.length}`;\n      counter.textContent=`${String(current+1).padStart(2,'0')} / ${String(galleryImages.length).padStart(2,'0')}`;\n      dots.forEach((dot,i)=>dot.classList.toggle('active',i===current));\n    };\n    grooCardContent.querySelectorAll('[data-groo-gallery-step]').forEach(button=>button.addEventListener('click',()=>show(current+Number(button.dataset.grooGalleryStep))));\n    dots.forEach((dot,i)=>dot.addEventListener('click',()=>show(i)));\n    let startX=0;\n    image.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});\n    image.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)show(current+(dx<0?1:-1));},{passive:true});\n  }\n}\nfunction escModal(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction projectGalleryImages(p){\n  return [p.detailCover,p.img,...(p.gallery||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);\n}\nfunction newsCardMarkup(post){\n  const copy=`<div class=\"groo-news-modal-copy\"><div class=\"groo-modal-kicker\">${escModal(post.category)} · ${escModal(post.date)}</div><h2 id=\"grooCardTitle\">${escModal(post.title)}</h2><p class=\"groo-modal-lead\">${escModal(post.lead)}</p>${newsFactMarkup function normalizeRoute(hash){
  let route=String(hash||'#home').replace(/^#/,'').trim()||'home';
  const aliases={
    about:'company',
    business:'collaboration',
    'business-detail':'business-services',
    projects:'projects-execution',
    'business-ai':'projects-execution'
  };
  route=aliases[route]||route;

  const valid=new Set([
    'home',
    'company','history','milestones','organization','certificates',
    'business-services','collaboration',
    'projects-execution','business-bim','business-design','business-supervision',
    'news','recruit','contact'
  ]);

  return 'home';
}

}

function patchApp(html,route){
  const safe=normalizeRoute('#'+route);

  /* APP의 본문 스크립트보다 먼저 정확한 hash를 설정.
     APP에는 HOME 섹션이 없어서 예전 메인이 뜰 수 없다. */
  html=injectAfterHeadOpen(
    html,
    "if(location.hash!=='#" + safe + "'){const next=new URL(location.href);next.hash='" + safe + "';history.replaceState(null,'',next.href);}"
  );

  const bridge=`
  document.addEventListener('click',function(e){
    const a=e.target.closest('a[href^="#"]'); if(!a)return;
    const href=a.getAttribute('href')||'';

    if(href==='#home'){
      e.preventDefault();
      e.stopPropagation();
      parent.postMessage({type:'groo-route',route:'home'},'*');
      return;
    }

    /* 내부 페이지끼리 이동할 때는 APP 자체 setActive/hashchange를 사용한다.
       부모 주소만 갱신하고 wrapper를 다시 로드하지 않는다. */
    if(href.length>1){
      setTimeout(function(){
        parent.postMessage({type:'groo-sync',route:href.slice(1)},'*');
      },0);
    }
  },true);`;

  return injectBeforeBodyEnd(html,bridge);
}

/* Both page sources are present before route initialization. */

function setTopHash(route,push){
  const next='#'+route;
  window.grooUpdateSEO(route);
  if(location.hash===next)return;
  if(push) history.pushState({route},'',next);
  else history.replaceState({route},'',next);
}

async function render(force=false){
  const route=normalizeRoute(location.hash);
  window.grooUpdateSEO(route);
  const mode=route==='home'?'home':'app';

  /* Page sources are already available. */

  /* APP 안에서 다른 내부 페이지로 이동하는 경우에는 srcdoc을 다시 만들지 않는다 */
  if(!force && mode==='app' && currentMode==='app'){
    try{
      const win=frame.contentWindow;
      if(win){
        const target='#'+route;
        if(typeof win.replaceAppRoute==='function') win.replaceAppRoute(route);
        if(typeof win.setActive==='function') win.setActive(target);
        else if(win.location.hash!==target) win.location.hash=target;
        return;
      }
    }catch(_){}
  }

  currentMode=mode;
  loading.classList.remove('hide');
  frame.style.visibility='visible';

  frame.srcdoc = mode==='home'
    ? patchHome(HOME_HTML)
    : patchApp(APP_HTML,route);
}

window.addEventListener('message',function(e){
  const d=e.data||{};
  if(d.type==='groo-route'){
    const route=normalizeRoute('#'+d.route);
    setTopHash(route,true);
    render(true);
  } else if(d.type==='groo-project-navigation'){
    const route=normalizeRoute('#'+d.route);
    setTopHash(route,true);
  } else if(d.type==='groo-sync'){
    const route=normalizeRoute('#'+d.route);
    /* 내부 APP 이동은 재렌더 없이 주소만 맞춤 */
    setTopHash(route,false);
  }
});

window.addEventListener('popstate',function(){
  const state=window.GROO_PROJECT_LIST_STATE;
  if(state&&normalizeRoute(location.hash)===state.route) state.restore=true;
  render();
});
window.addEventListener('hashchange',function(){
  const route=normalizeRoute(location.hash);
  const mode=route==='home'?'home':'app';
  if(mode!==currentMode) render(true);
});

frame.addEventListener('load',function(){
  frame.style.visibility='visible';
  setTimeout(()=>loading.classList.add('hide'),60);
});

(async function(){
  const route=normalizeRoute(location.hash);
  history.replaceState({route},'','#'+route);
  await render(true);
})();
</script>
</body>
</html>
